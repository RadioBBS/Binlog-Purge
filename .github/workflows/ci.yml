# Binlog-Purge – CI ohne Produktionsdaten.
#
# Projekt:     Binlog-Purge
# Modul:       .github/workflows/ci.yml
# Version:     1.0.0
# Stand:       2026-09-03
# Abhaengig:   Python >= 3.10; MariaDB-Client mariadb oder mysql
# Bezug:       requirements.txt
# Lizenz:      MIT
# Upstream:    –
# Erstellt mit: Cursor Grok 4.6
# Autor:       (FFHB) / RadioBBS
#
# Historie
# --------
# Version 1.0.0 – 2026-09-03 – unittest tests.test_binlog_purge

name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_binlog_purge
